<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Олдоград — подключение</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #08020d;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
    background-image: url("OGOldograd.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

    /* Затемнение */
    .overlay {
        position: absolute;
        inset: 0;
        background:
            linear-gradient(
                rgba(5, 0, 10, 0.12),
                rgba(5, 0, 10, 0.35)
            );
    }

    /* Верхний левый блок */
    .status {
        position: absolute;
        left: 3%;
        top: 4%;
        width: 430px;

        color: #b96cff;
        font-size: 17px;
        line-height: 1.75;

        text-shadow:
            0 0 8px rgba(145, 45, 255, 0.8);
    }

    .status-line {
        opacity: 0.65;
    }

    .status-line.active {
        opacity: 1;
    }

    .status-line::before {
        content: "// ";
        color: #7f35b8;
    }

    .server-name {
        position: absolute;
        left: 50%;
        bottom: 8.5%;

        transform: translateX(-50%);

        color: #c98aff;
        font-size: 22px;
        letter-spacing: 2px;

        text-shadow:
            0 0 12px rgba(170, 55, 255, 0.8);
    }

    .loading-title {
        position: absolute;
        left: 50%;
        bottom: 14%;

        transform: translateX(-50%);

        color: #d29cff;
        font-size: 22px;
        letter-spacing: 2px;

        text-shadow:
            0 0 10px rgba(165, 55, 255, 0.8);
    }

    /* Прогресс */
    .progress-wrapper {
        position: absolute;
        left: 50%;
        bottom: 17.5%;

        transform: translateX(-50%);

        width: 40%;
        min-width: 450px;
        max-width: 850px;
    }

    .progress-background {
        width: 100%;
        height: 20px;

        border: 2px solid #8224c5;
        border-radius: 12px;

        background: rgba(10, 0, 20, 0.75);

        box-shadow:
            0 0 10px rgba(130, 36, 197, 0.5),
            inset 0 0 8px rgba(0, 0, 0, 0.8);

        overflow: hidden;
    }

    .progress {
        width: 0%;
        height: 100%;

        border-radius: 10px;

        background: linear-gradient(
            90deg,
            #8d20d7,
            #d56cff,
            #8d20d7
        );

        box-shadow:
            0 0 12px #bd43ff,
            0 0 25px rgba(189, 67, 255, 0.7);

        transition: width 0.25s ease;
    }

    .percent {
        position: absolute;
        right: 0;
        top: 28px;

        color: #c58cff;
        font-size: 14px;
        opacity: 0.85;
    }

    /* Маленькая информация */
    .info {
        position: absolute;
        left: 50%;
        bottom: 3%;

        transform: translateX(-50%);

        color: #8f6ba8;
        font-size: 14px;
        letter-spacing: 1px;
    }

    @media (max-width: 1000px) {
        .progress-wrapper {
            min-width: 300px;
            width: 55%;
        }

        .status {
            font-size: 14px;
            width: 330px;
        }
    }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="status">
    <div id="s1" class="status-line active">
        ПОДКЛЮЧЕНИЕ К СЕРВЕРУ...
    </div>

    <div id="s2" class="status-line">
        УСТАНОВЛЕНИЕ СОЕДИНЕНИЯ...
    </div>

    <div id="s3" class="status-line">
        ОТПРАВКА ДАННЫХ КЛИЕНТУ...
    </div>

    <div id="s4" class="status-line">
        ПОЛУЧЕНИЕ ДАННЫХ СЕРВЕРА...
    </div>

    <div id="s5" class="status-line">
        ЗАГРУЗКА...
    </div>
</div>

<div class="loading-title">
    ЗАГРУЗКА ДАННЫХ...
</div>

<div class="progress-wrapper">

    <div class="progress-background">
        <div id="progress" class="progress"></div>
    </div>

    <div id="percent" class="percent">
        0%
    </div>

</div>

<div class="server-name">
    ПОДКЛЮЧЕНИЕ К СЕРВЕРУ «ОЛДОГРАД»
</div>

<div class="info" id="info">
    ОЖИДАНИЕ СОЕДИНЕНИЯ...
</div>


<script>

let totalFiles = 0;
let neededFiles = 0;


/*
    GMod сообщает общее количество файлов
*/
window.SetFilesTotal = function(total)
{
    totalFiles = total;

    updateProgress();
};


/*
    GMod сообщает сколько файлов осталось
*/
window.SetFilesNeeded = function(needed)
{
    neededFiles = needed;

    updateProgress();
};


/*
    Обновление прогресс-бара
*/
function updateProgress()
{
    if (totalFiles <= 0)
        return;

    let loaded = totalFiles - neededFiles;

    let percent = Math.floor(
        (loaded / totalFiles) * 100
    );

    percent = Math.max(0, Math.min(100, percent));

    document.getElementById("progress").style.width =
        percent + "%";

    document.getElementById("percent").innerText =
        percent + "%";

    document.getElementById("info").innerText =
        "ЗАГРУЖЕНО " + loaded +
        " ИЗ " + totalFiles + " ФАЙЛОВ";
}


/*
    GMod сообщает, какой файл скачивается
*/
window.DownloadingFile = function(fileName)
{
    document.getElementById("info").innerText =
        "ЗАГРУЗКА: " + fileName;

    document.getElementById("s3").classList.add("active");
};


/*
    Изменение статуса подключения
*/
window.SetStatusChanged = function(status)
{
    document.getElementById("info").innerText =
        status;

    document.getElementById("s5").classList.add("active");
};


/*
    Информация о сервере
*/
window.GameDetails = function(
    servername,
    serverurl,
    mapname,
    maxplayers,
    steamid,
    gamemode,
    volume,
    language
)
{
    document.getElementById("info").innerText =
        "СЕРВЕР: " + servername;
};


/*
    Небольшая начальная анимация
*/
setInterval(function()
{
    let lines = document.querySelectorAll(".status-line");

    let active = Math.floor(
        Math.random() * lines.length
    );

    lines.forEach(function(line)
    {
        line.classList.remove("active");
    });

    lines[active].classList.add("active");

}, 1500);

</script>

</body>
</html>
